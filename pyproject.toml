[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dtin"
version = "0.1.0"
description = "D-TIN: Delaunay triangulation surface reconstruction for track-sampled satellite altimetry"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Xiaoyu Xia" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
]

[project.optional-dependencies]
kriging = ["gstatsim>=1.0.5", "scikit-gstat>=1.0", "scikit-learn>=1.3"]
geotiff = ["rasterio>=1.3"]
app = ["ipywidgets>=7.6", "matplotlib>=3.7"]
dev = [
    "pytest>=8",
    "nbformat>=5",
    "nbconvert>=7",
    "ipykernel>=6",
    "gstatsim>=1.0.5", "scikit-gstat>=1.0", "scikit-learn>=1.3",
    "pyproj>=3.4", "rasterio>=1.3",
    "ipywidgets>=7.6", "matplotlib>=3.7",
]

[project.scripts]
dtin = "dtin.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
